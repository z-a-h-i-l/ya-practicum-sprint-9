# =============================================================================
# CDN Nginx — Reverse Proxy + Caching for S3 (Minio) Reports
# =============================================================================
#
# Architecture:
#   Client → Nginx (CDN, :8083) → Minio (:9000)
#
# Caching behaviour:
#   - Successful GET/HEAD responses (200) are cached for 1 hour.
#   - Cache key includes host + full URI (including version query param).
#   - Version query param (?v=<timestamp>) is used for cache busting.
#
# Cache invalidation strategy:
#   Reports are stored in Minio under a stable key:
#     {customer_id}/{period_start}_{period_end}.json
#
#   The CDN URL includes a version parameter, e.g.:
#     http://cdn:8083/reports/C001/2024-01-01_2024-01-31.json?v=1717000000
#
#   When a report is regenerated (force_refresh=true), the reports-api
#   returns a new CDN URL with an updated ?v= timestamp.  This causes
#   a cache miss in Nginx (different cache key), fetching the fresh
#   object from Minio.  Old cache entries expire naturally after
#   inactive=2h.
#
#   Advantages over PURGE:
#     - No external Nginx module required
#     - Atomic: new cache entry is created before old one expires
#     - Old entries auto-cleanup via inactive timeout
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # ---------------------------------------------------------------------------
    # Basic settings
    # ---------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;

    log_format cdn '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   'cache_status=$upstream_cache_status '
                   'rt=$request_time uct=$upstream_connect_time '
                   'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log cdn;

    # ---------------------------------------------------------------------------
    # Proxy cache path
    #   levels=1:2        — two-level directory hierarchy (avoids too many files
    #                        in a single directory)
    #   keys_zone=cdn:10m — 10 MB shared memory zone for cache keys
    #   max_size=1g       — maximum 1 GB of cached data on disk
    #   inactive=2h       — objects unused for 2h are removed from cache
    #   use_temp_path=off — write directly to cache dir (perf)
    # ---------------------------------------------------------------------------
    proxy_cache_path /var/cache/nginx/cdn
                     levels=1:2
                     keys_zone=cdn_cache:10m
                     max_size=1g
                     inactive=2h
                     use_temp_path=off;

    # ---------------------------------------------------------------------------
    # Upstream — Minio S3 API
    # ---------------------------------------------------------------------------
    upstream minio_s3 {
        server minio:9000;
    }

    # ---------------------------------------------------------------------------
    # CDN server
    # ---------------------------------------------------------------------------
    server {
        listen 8083;
        server_name localhost;

        # -----------------------------------------------------------------------
        # Main CDN location — proxies to Minio with caching
        #
        # Cache key includes the full $uri and $is_args$args (query string).
        # The version parameter (?v=<timestamp>) in the URL ensures cache busting.
        # -----------------------------------------------------------------------
        location / {
            # Proxy to Minio S3
            proxy_pass http://minio_s3;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Use the cache
            proxy_cache cdn_cache;

            # Cache key includes query string for version-based cache busting
            proxy_cache_key "$scheme$request_method$host$uri$is_args$args";

            # Cache valid responses:
            #   200 OK — 1 hour
            proxy_cache_valid 200 1h;

            # 404 not found — cache briefly (1 min) to avoid hammering Minio
            proxy_cache_valid 404 1m;

            # Serve stale content while revalidating (background update)
            proxy_cache_background_update on;

            # Allow serving stale cache for up to 2h if upstream is down
            proxy_cache_use_stale error timeout updating
                                 http_500 http_502 http_503 http_504;

            # Add cache status header for debugging
            add_header X-Cache-Status $upstream_cache_status always;

            # CORS for CDN assets
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        }

        # -----------------------------------------------------------------------
        # Purge-specific location (delegates to main / with a bypass header)
        # Used by reports-api to force a cache refresh on regeneration.
        # The PURGE method with X-Purge: true header bypasses the cache and
        # fetches a fresh copy from Minio, updating the cached entry.
        # -----------------------------------------------------------------------
        location ~ ^/purge(/.*) {
            # Restrict to internal Docker networks
            allow 127.0.0.0/8;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny all;

            proxy_pass http://minio_s3$1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Bypass cache — fetch fresh from Minio and update the cache
            proxy_cache cdn_cache;
            proxy_cache_key "$scheme$request_method$host$1";
            proxy_cache_bypass $http_x_purge;
            proxy_no_cache $http_x_purge;
        }

        # -----------------------------------------------------------------------
        # Health check for the CDN itself
        # -----------------------------------------------------------------------
        location /health {
            access_log off;
            return 200 "CDN OK\n";
            add_header Content-Type text/plain;
        }
    }
}